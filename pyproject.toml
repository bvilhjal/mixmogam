[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mixmogam"
dynamic = ["version"]
description = "Super-efficient mixed linear models for genome-wide association mapping"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mixmogam contributors" }]
keywords = [
    "gwas",
    "mixed linear model",
    "association mapping",
    "heritability",
    "statistical genetics",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.urls]
Homepage = "https://github.com/bvilhjal/mixmogam"
Repository = "https://github.com/bvilhjal/mixmogam"
Documentation = "https://github.com/bvilhjal/mixmogam#readme"
Issues = "https://github.com/bvilhjal/mixmogam/issues"
Changelog = "https://github.com/bvilhjal/mixmogam/blob/master/CHANGELOG.md"

[project.scripts]
mixmogam = "mixmogam.cli:main"

[project.optional-dependencies]
fast = ["numba>=0.59", "threadpoolctl>=3"]
plot = ["matplotlib>=3.7"]
hdf5 = ["h5py>=3.8"]
dataframe = ["pandas>=1.5"]
formats = ["pgenlib>=0.94.1", "pysam>=0.23", "zstandard>=0.22"]
bgen = ["bgen-reader>=4.0"]
test = ["pytest>=7"]
lint = ["ruff>=0.5"]

[tool.setuptools]
packages = ["mixmogam", "mixmogam.io"]

[tool.setuptools.dynamic]
version = { attr = "mixmogam.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: heavier reference-oracle or simulation test",
    "integration: end-to-end pipeline test (e.g. bundled A. thaliana data)",
    "external: requires an external tool not installed in CI",
    "numba: exercises or requires the Numba JIT path",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["F"]
