name: CI

on:
  push:
  pull_request:
    branches: [master]

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            extras: test,lint
            dependencies: numpy==1.26.4 scipy==1.11.4
          - python-version: "3.13"
            extras: test,fast,plot,hdf5,formats,bgen,lint
            dependencies: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # phensim (private, not on PyPI) is used only by benchmarks/, which
      # CI does not run; the package and its tests do not import it
      - run: python -m pip install -e ".[${{ matrix.extras }}]" ${{ matrix.dependencies }}
      - run: ruff check .
      # Each test step runs even if an earlier step failed (the job still
      # fails), so a lint or fast-suite failure does not hide the slow and
      # integration results.
      - name: Fast tests
        if: ${{ !cancelled() }}
        run: pytest -q -m "not slow and not integration and not external"
      - name: Slow and integration tests
        if: ${{ !cancelled() }}
        run: pytest -q -m "(slow or integration) and not external"
  external-gate:
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.check.outputs.has_token }}
    steps:
      - id: check
        env:
          LDPRED3_TOKEN: ${{ secrets.LDPRED3_READ_TOKEN || secrets.LDPRED3_FOR_BIPRED }}
        run: echo "has_token=${LDPRED3_TOKEN:+true}" >> "$GITHUB_OUTPUT"
  # Tests that need the private ldpred3 package are marked `external`
  # (per-test on tests/test_stage1.py and tests/test_cli.py, and
  # pytestmark on tests/test_stage1_ldpred3_int8.py). ldpred3 is outside
  # mixmogam's install requirements, so this job installs it with a read
  # token and runs `pytest -q -m external`.
  external:
    runs-on: ubuntu-latest
    needs: external-gate
    if: needs.external-gate.outputs.has_token == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[test,fast]"
      # Pinned to the ldpred3 commit the integrate/stage1 reviews ran
      # (2da4735c, 0.10.4, master on 2026-11-14). The tags (v0.4.x, v0.7.x)
      # predate ldpred3-fast and FAST_EXPERIMENTAL_WARNING. Bump deliberately.
      - run: python -m pip install "git+https://x-access-token:${LDPRED3_TOKEN}@github.com/bvilhjal/ldpred3@2da4735cbd28e91bdd0f154562444bb70f3fc818"
        env:
          LDPRED3_TOKEN: ${{ secrets.LDPRED3_READ_TOKEN || secrets.LDPRED3_FOR_BIPRED }}
      - run: python -c "import ldpred3; print('ldpred3', ldpred3.__version__)"
      - run: pytest -q -m external -rs --junitxml=external.xml
      # The external tests skip when ldpred3 cannot be imported, so a broken
      # install would otherwise pass with nothing run. Require the int8 file
      # to have run (not skipped) at least one test.
      - name: Require int8 external tests to have run
        if: ${{ !cancelled() }}
        run: |
          python - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET
          cases = ET.parse("external.xml").getroot().iter("testcase")
          ran = [c for c in cases if "test_stage1_ldpred3_int8" in c.get("classname", "")
                 and c.find("skipped") is None]
          print(f"int8 external tests run: {len(ran)}")
          sys.exit(0 if ran else 1)
          EOF
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Build the source distribution in isolation
        run: |
          mkdir /tmp/mixmogam-sdist
          tar -xzf dist/*.tar.gz -C /tmp/mixmogam-sdist
          cd /tmp/mixmogam-sdist/mixmogam-*
          python -m build --wheel
          python -m pip install ".[test]"
          python -m pytest -q tests/test_stage1_hm3.py::test_map_bundled_and_fixture
      - name: Check installed wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd /tmp
          python -I -c "import mixmogam; from importlib.metadata import version; assert mixmogam.__version__ == version('mixmogam')"
