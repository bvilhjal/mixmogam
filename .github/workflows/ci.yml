name: CI

on:
  push:
    branches: [master, "claude/**"]
  pull_request:
    branches: [master]

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # phensim (private, not on PyPI) is used only by benchmarks/, which
      # CI does not run; the package and its tests do not import it
      - run: python -m pip install -e ".[test,fast,plot,hdf5,lint]"
      - run: ruff check .
      - run: pytest -q -m "not slow and not integration"
      - run: pytest -q -m "slow or integration"
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Check installed wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd /tmp
          python -I -c "import mixmogam; from importlib.metadata import version; assert mixmogam.__version__ == version('mixmogam')"
