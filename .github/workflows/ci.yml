name: CI

on:
  push:
  pull_request:
    branches: [master]

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            extras: test,lint
            dependencies: numpy==1.26.4 scipy==1.11.4
          - python-version: "3.13"
            extras: test,fast,plot,hdf5,formats,bgen,lint
            dependencies: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # phensim (private, not on PyPI) is used only by benchmarks/, which
      # CI does not run; the package and its tests do not import it
      - run: python -m pip install -e ".[${{ matrix.extras }}]" ${{ matrix.dependencies }}
      - run: ruff check .
      - run: pytest -q -m "not slow and not integration and not external"
      - run: pytest -q -m "(slow or integration) and not external"
  external-gate:
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.check.outputs.has_token }}
    steps:
      - id: check
        env:
          LDPRED3_TOKEN: ${{ secrets.LDPRED3_READ_TOKEN || secrets.LDPRED3_FOR_BIPRED }}
        run: echo "has_token=${LDPRED3_TOKEN:+true}" >> "$GITHUB_OUTPUT"
  # The LDpred3 stage-1 seam's tests are marked `external`: ldpred3 is private
  # and outside mixmogam's install requirements, so they need a read token.
  external:
    runs-on: ubuntu-latest
    needs: external-gate
    if: needs.external-gate.outputs.has_token == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[test,fast]"
      - run: python -m pip install "git+https://x-access-token:${LDPRED3_TOKEN}@github.com/bvilhjal/ldpred3@master"
        env:
          LDPRED3_TOKEN: ${{ secrets.LDPRED3_READ_TOKEN || secrets.LDPRED3_FOR_BIPRED }}
      - run: pytest -q -m external
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Build the source distribution in isolation
        run: |
          mkdir /tmp/mixmogam-sdist
          tar -xzf dist/*.tar.gz -C /tmp/mixmogam-sdist
          cd /tmp/mixmogam-sdist/mixmogam-*
          python -m build --wheel
      - name: Check installed wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd /tmp
          python -I -c "import mixmogam; from importlib.metadata import version; assert mixmogam.__version__ == version('mixmogam')"
